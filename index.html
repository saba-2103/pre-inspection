<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>ACME Pre-Inspection Prototypes</title>
<link rel="stylesheet" href="v1/css/fonts.css">
<style>
  :root { --brand: #1c3095; --heading: #002767; --text: #212529; --muted: #757575; --line: #e5e5e5; --bg: #f4f5f7; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 440px; margin: 0 auto; padding: max(24px, env(safe-area-inset-top)) 16px 32px; display: flex; flex-direction: column; gap: 20px; }
  .top { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
  .top img { width: 33px; height: 36px; }
  .top h1 { font: 700 22px/1.2 'Poppins', sans-serif; color: var(--heading); }
  .top p { font-size: 13px; color: var(--muted); }
  .list { display: flex; flex-direction: column; gap: 12px; }
  .card { display: flex; gap: 14px; align-items: center; padding: 16px; background: #fff; border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; transition: border-color .15s, box-shadow .15s; }
  .card:hover, .card:focus-visible { border-color: var(--brand); box-shadow: 0 4px 16px rgba(28,48,149,.1); outline: none; }
  .tag { flex-shrink: 0; width: 48px; height: 48px; border-radius: 10px; background: #e7eefc; color: var(--heading); display: flex; align-items: center; justify-content: center; font: 700 16px/1 'Poppins', sans-serif; }
  .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .txt b { font: 600 15px/1.3 'Poppins', sans-serif; color: var(--heading); }
  .txt span { font-size: 12px; line-height: 1.4; color: var(--muted); }
  .go { flex-shrink: 0; color: var(--brand); font-size: 20px; }
  .note { font-size: 11px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="top">
      <img src="v1/assets/core/logo.svg" alt="ACME">
      <h1>Car Pre-Inspection</h1>
      <p>Prototype versions — tap one to open it</p>
    </div>
    <div class="list" id="list"></div>
    <p class="note">Internal · each version opens at its first screen; refresh inside a version restarts it.</p>
  </main>
  <script>
    // One entry per version; each lives in its own folder (v1/, v2/, …)
    const VERSIONS = [
      { id: 'V1', path: 'v1/', name: 'Current flow', desc: 'Figma “ACME - V1” · WhatsApp → interior → exterior → review & submit' },
      { id: 'V2', path: 'v2/', name: 'Redesigned flow', desc: 'Figma page “V2” · one rotation per stage, live checks, captions, auto-advance walk-around' },
    ];
    document.getElementById('list').innerHTML = VERSIONS.map((v) => `
      <a class="card" href="${v.path}">
        <div class="tag">${v.id}</div>
        <div class="txt"><b>${v.name}</b><span>${v.desc}</span></div>
        <div class="go">›</div>
      </a>`).join('');
  </script>
</body>
</html>
